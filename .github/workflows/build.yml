name: build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /std:c++17 /EHsc splash.cpp /link user32.lib gdi32.lib msimg32.lib advapi32.lib winmm.lib /SUBSYSTEM:WINDOWS /OUT:splash.exe
      - uses: actions/upload-artifact@v4
        with:
          name: splash
          path: splash.exe
