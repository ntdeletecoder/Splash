name: build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          for /f "delims=" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find VC\Auxiliary\Build\vcvars64.bat') do call "%%i"
          cl /std:c++17 /EHsc splash.cpp /link user32.lib gdi32.lib msimg32.lib advapi32.lib winmm.lib shell32.lib /SUBSYSTEM:WINDOWS /OUT:splash.exe
      - uses: actions/upload-artifact@v4
        with:
          name: splash
          path: splash.exe
