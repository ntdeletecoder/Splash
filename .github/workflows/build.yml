name: build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          cl /std:c++17 /EHsc splash.cpp /link user32.lib gdi32.lib msimg32.lib advapi32.lib winmm.lib /SUBSYSTEM:WINDOWS /OUT:splash.exe
      - uses: actions/upload-artifact@v4
        with:
          name: splash
          path: splash.exe
